<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Caminho da Água - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { onyx: '#171721', graphite: '#1e1e2a', obsidian: '#272735', cobalt: '#5266eb', ash: '#c3c3cc', ivory: '#ededf3' },
                          fontFamily: { sans: ['Inter', 'sans-serif'] },
                          borderRadius: { card: '12px', pill: '32px' } }
            }
        }
    </script>
    <style>
        body { background-color: #171721; color: #ededf3; user-select: none; touch-action: none; overflow: hidden; }
        .btn-primary { background: linear-gradient(135deg, #5266eb, #3b4bc2); color: #ffffff; padding: 14px 28px; border-radius: 32px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(82,102,235,0.4); }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(82,102,235,0.6); }
        .btn-ghost { background-color: transparent; border: 1px solid #ededf3; color: #ededf3; padding: 10px 20px; border-radius: 40px; font-weight: 500; transition: all 0.2s; }
        .btn-ghost:hover { background-color: rgba(237, 237, 243, 0.1); }
        
        /* Board and Slots */
        #board-container { background: linear-gradient(145deg, #1e1e2a, #13131b); border: 2px solid #2a2a35; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5); }
        .slot { background: #1a1a24; border: 1px dashed #3a3a4a; border-radius: 12px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.6); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; transition: border 0.2s; }
        .slot:hover { border-style: solid; border-color: #5266eb; }
        .slot.drag-over { border-style: solid; border-color: #00f0ff; background: #232332; }
        
        /* Pipe Graphics */
        .pipe-svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6)); pointer-events: none; }
        
        /* Water Flow Animations */
        .pipe-water { opacity: 0; transition: opacity 0.2s; }
        .filled .pipe-water { stroke: #00f0ff; filter: drop-shadow(0 0 12px #00f0ff); opacity: 1; }
        .error-blink .pipe-water { stroke: #ff3366; filter: drop-shadow(0 0 12px #ff3366); opacity: 1; animation: blink 0.4s infinite alternate; }
        
        @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }
        
        /* Inventory Items */
        .source-pipe { background: #272735; border: 2px solid #3a3a4a; border-radius: 12px; cursor: grab; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .source-pipe:active { cursor: grabbing; transform: scale(0.95); }
        .source-pipe:hover { border-color: #bfa173; background: #2e2e3d; }
        
        /* Drag Clone */
        .drag-clone { position: absolute; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 15px 20px rgba(0,0,0,0.7)); }

        /* Confetti/Particles */
        .particle { position: absolute; pointer-events: none; border-radius: 50%; animation: pop 0.8s cubic-bezier(0,0,0.2,1) forwards; }
        @keyframes pop { 0% { transform: scale(1) translate(0,0); opacity: 1; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Global SVG Defs for Premium Metallic Pipes -->
    <svg width="0" height="0" class="absolute">
        <defs>
            <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d4af37"/>
                <stop offset="30%" stop-color="#fff5c0"/>
                <stop offset="50%" stop-color="#aa7c11"/>
                <stop offset="80%" stop-color="#8b5a2b"/>
                <stop offset="100%" stop-color="#4a3a20"/>
            </linearGradient>
            <linearGradient id="pipeGradCorner" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fff5c0"/>
                <stop offset="50%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#8b5a2b"/>
            </linearGradient>
        </defs>
    </svg>

    <nav class="p-6 border-b border-white/5 flex justify-between items-center z-10 bg-onyx/80 backdrop-blur-md">
        <a href="index.html" class="btn-ghost text-sm">&larr; Voltar ao Início</a>
        <div class="flex items-center gap-4">
            <div class="text-sm font-extrabold text-cobalt uppercase tracking-widest hidden md:block">O Caminho da Água</div>
            <img src="assets/mascote_robo.jpg" class="w-10 h-10 rounded-full border-2 border-white/20 shadow-lg object-cover" alt="Mascote">
        </div>
    </nav>

    <!-- Mission Start Modal -->
    <div id="mission-start" class="fixed inset-0 z-50 flex items-center justify-center bg-onyx/90 backdrop-blur-md transition-opacity duration-500">
        <div class="bg-gradient-to-br from-cobalt to-blue-600 p-10 rounded-[32px] text-center shadow-[0_20px_60px_rgba(59,130,246,0.6)] border border-white/20 max-w-md transform transition-transform scale-100">
            <div class="text-7xl mb-6 drop-shadow-lg">💧</div>
            <h2 class="text-3xl font-extrabold text-white mb-4 uppercase tracking-wider">Nova Missão</h2>
            <p class="text-blue-100 text-lg mb-8 font-medium">A horta precisa de água! Conecte os canos para transportar a chuva até a cisterna sem desperdício.</p>
            <button onclick="startMission()" class="bg-white text-cobalt px-10 py-4 rounded-full font-bold text-xl hover:bg-blue-50 transition-transform hover:scale-105 shadow-xl">Aceitar Missão</button>
        </div>
    </div>

    <!-- Main Game (Existing) -->
    <main class="flex-grow flex flex-col md:flex-row items-center justify-center p-6 gap-6 md:gap-12 w-full max-w-[1000px] mx-auto relative blur-sm transition-all duration-500" id="game-main">
        
        <!-- Source (Cloud) -->
        <div class="flex flex-col items-center">
            <div class="text-6xl md:text-7xl drop-shadow-[0_0_30px_rgba(0,240,255,0.6)] animate-bounce relative z-10">🌧️</div>
            <div class="w-4 h-8 md:h-16 bg-[#00f0ff] rounded-t-full shadow-[0_0_20px_#00f0ff] -mt-2"></div>
        </div>

        <!-- 4x4 Grid Board -->
        <div id="board-container" class="p-4 relative">
            <div id="board" class="grid grid-cols-4 gap-2 md:gap-3 w-[280px] h-[280px] md:w-[400px] md:h-[400px]">
                <!-- Slots generated by JS -->
            </div>
            
            <!-- Success Modal -->
            <div id="success-msg" class="absolute inset-0 bg-onyx/90 backdrop-blur-md flex-col justify-center items-center rounded-2xl hidden z-20 opacity-0 transition-opacity duration-500 border-4 border-[#00f0ff]">
                <div class="text-7xl mb-4 animate-bounce">🏅</div>
                <h2 class="text-4xl font-extrabold text-[#00f0ff] mb-2 drop-shadow-[0_0_20px_#00f0ff] uppercase tracking-widest text-center">Missão<br/>Finalizada!</h2>
                <p class="text-ivory mb-8 text-center max-w-[250px] font-medium text-lg">Água conectada com sucesso. Você salvou a colheita!</p>
                <button onclick="resetGame()" class="btn-primary text-sm px-8 py-4 text-lg">Próxima Missão</button>
            </div>
        </div>

        <!-- Destination (Cistern) -->
        <div class="flex flex-col items-center">
            <div class="w-4 h-8 md:h-16 bg-slate-700 rounded-b-full shadow-inner mb-2 -mt-2"></div>
            <div class="text-6xl md:text-7xl drop-shadow-xl relative z-10">🛢️</div>
        </div>
    </main>

    <!-- Bottom Inventory / Controls -->
    <div class="w-full bg-graphite border-t border-white/5 p-6 flex flex-col items-center gap-6 relative z-10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <div class="text-ash font-medium uppercase tracking-widest text-xs md:text-sm text-center">
            Arraste os canos para o painel • Clique no cano para girar
        </div>
        
        <div class="flex gap-6 md:gap-10">
            <!-- Draggable Straights -->
            <div class="source-pipe w-20 h-20 md:w-24 md:h-24 p-2 flex items-center justify-center" data-type="straight" onpointerdown="startDrag(event, 'straight')">
                <!-- SVG Injected by JS -->
            </div>
            <!-- Draggable Corners -->
            <div class="source-pipe w-20 h-20 md:w-24 md:h-24 p-2 flex items-center justify-center" data-type="corner" onpointerdown="startDrag(event, 'corner')">
                <!-- SVG Injected by JS -->
            </div>
        </div>
        
        <div class="flex gap-4">
            <button onclick="clearBoard()" class="btn-ghost text-sm md:text-base border-ash text-ash">Limpar Tudo</button>
            <button onclick="testFlow()" class="btn-primary text-sm md:text-base">💧 Liberar Água</button>
        </div>
    </div>

    <script>
        function startMission() {
            playSound('blip');
            const modal = document.getElementById('mission-start');
            modal.classList.add('opacity-0');
            document.getElementById('game-main').classList.remove('blur-sm');
            setTimeout(() => modal.classList.add('hidden'), 500);
        }

        // Web Audio Synthesis
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'place') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if(type === 'rotate') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'blip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.6);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            }
        }

        const SVG_STRAIGHT = `
            <svg viewBox="0 0 100 100" class="pipe-svg transition-transform duration-300">
                <path d="M 50 0 L 50 100" stroke="#111" stroke-width="44" stroke-linecap="square"/>
                <path d="M 50 0 L 50 100" stroke="url(#pipeGrad)" stroke-width="38" stroke-linecap="square"/>
                <path d="M 50 0 L 50 100" stroke="#171721" stroke-width="16" stroke-linecap="square"/>
                <path class="pipe-water" d="M 50 0 L 50 100" stroke="#00f0ff" stroke-width="16" stroke-linecap="square"/>
            </svg>
        `;
        const SVG_CORNER = `
            <svg viewBox="0 0 100 100" class="pipe-svg transition-transform duration-300">
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#111" stroke-width="44" stroke-linecap="square"/>
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="url(#pipeGradCorner)" stroke-width="38" stroke-linecap="square"/>
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#171721" stroke-width="16" stroke-linecap="square"/>
                <path class="pipe-water" d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#00f0ff" stroke-width="16" stroke-linecap="square"/>
            </svg>
        `;

        document.querySelector('[data-type="straight"]').innerHTML = SVG_STRAIGHT;
        document.querySelector('[data-type="corner"]').innerHTML = SVG_CORNER;

        let grid = [];
        const ROWS = 4, COLS = 4;
        const boardEl = document.getElementById('board');

        function initGrid() {
            boardEl.innerHTML = '';
            for(let r=0; r<ROWS; r++) {
                grid[r] = [];
                for(let c=0; c<COLS; c++) {
                    grid[r][c] = null;
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.id = `slot-${r}-${c}`;
                    // Rotation on click
                    slot.onclick = () => {
                        let cell = grid[r][c];
                        if(cell) {
                            cell.rot = (cell.rot + 90) % 360;
                            slot.querySelector('.pipe-svg').style.transform = `rotate(${cell.rot}deg)`;
                            playSound('rotate');
                        }
                    };
                    boardEl.appendChild(slot);
                }
            }
            // Add visual markers for Entrance/Exit
            document.getElementById('slot-0-0').style.borderTop = '4px solid #00f0ff';
            document.getElementById('slot-3-3').style.borderBottom = '4px solid #00f0ff';
        }

        function clearBoard() {
            initGrid();
            playSound('error');
        }

        // Custom Cross-Platform Drag Engine
        let draggingType = null;
        let dragClone = null;

        function startDrag(e, type) {
            e.preventDefault();
            draggingType = type;
            dragClone = document.createElement('div');
            dragClone.className = 'drag-clone w-20 h-20 md:w-24 md:h-24';
            dragClone.innerHTML = type === 'straight' ? SVG_STRAIGHT : SVG_CORNER;
            document.body.appendChild(dragClone);
            
            moveClone(e.clientX, e.clientY);
            
            document.addEventListener('pointermove', onDragMove);
            document.addEventListener('pointerup', onDragEnd);
            playSound('rotate');
        }

        function moveClone(x, y) {
            if(dragClone) {
                dragClone.style.left = x + 'px';
                dragClone.style.top = y + 'px';
            }
        }

        function onDragMove(e) {
            moveClone(e.clientX, e.clientY);
            
            // Highlight hover
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('drag-over'));
            const elUnder = document.elementFromPoint(e.clientX, e.clientY);
            const slot = elUnder ? elUnder.closest('.slot') : null;
            if(slot) slot.classList.add('drag-over');
        }

        function onDragEnd(e) {
            document.removeEventListener('pointermove', onDragMove);
            document.removeEventListener('pointerup', onDragEnd);
            
            if(dragClone) dragClone.remove();
            
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('drag-over'));
            
            const elUnder = document.elementFromPoint(e.clientX, e.clientY);
            const slot = elUnder ? elUnder.closest('.slot') : null;
            
            if(slot && draggingType) {
                let [r, c] = slot.id.replace('slot-','').split('-').map(Number);
                grid[r][c] = { type: draggingType, rot: 0 };
                slot.innerHTML = draggingType === 'straight' ? SVG_STRAIGHT : SVG_CORNER;
                playSound('place');
                createParticles(e.clientX, e.clientY);
            }
            draggingType = null;
        }

        function createParticles(x, y) {
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.className = 'particle bg-yellow-400 w-2 h-2';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 100 + 'px');
                document.body.appendChild(p);
                setTimeout(()=>p.remove(), 800);
            }
        }

        function getConnections(type, rot) {
            // 0:Top, 1:Right, 2:Bottom, 3:Left
            if(type === 'straight') return (rot === 0 || rot === 180) ? [0, 2] : [1, 3];
            else return { 0: [0,1], 90: [1,2], 180: [2,3], 270: [3,0] }[rot];
        }

        function testFlow() {
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('filled', 'error-blink'));
            playSound('place'); // Start sound
            
            let r = 0, c = 0, enterDir = 0; // Starts top-left, entering from top
            let path = [];
            
            let flowTimer = setInterval(() => {
                // Out of bounds check
                if(r < 0 || r >= ROWS || c < 0 || c >= COLS) {
                    clearInterval(flowTimer);
                    // Check Win Condition: Exit bottom of (3,3)
                    if(r === ROWS && c === COLS-1 && enterDir === 0) {
                        winSequence();
                    } else {
                        failSequence(path);
                    }
                    return;
                }
                
                let cell = grid[r][c];
                if(!cell) { clearInterval(flowTimer); failSequence(path); return; }
                
                let conns = getConnections(cell.type, cell.rot);
                if(!conns.includes(enterDir)) { clearInterval(flowTimer); failSequence(path); return; }
                
                // Success for this cell
                let slotEl = document.getElementById(`slot-${r}-${c}`);
                slotEl.classList.add('filled');
                path.push(slotEl);
                playSound('blip');
                
                let exitDir = conns.find(d => d !== enterDir);
                
                // Move logic
                if(exitDir === 0) { r--; enterDir = 2; }
                else if(exitDir === 1) { c++; enterDir = 3; }
                else if(exitDir === 2) { r++; enterDir = 0; }
                else if(exitDir === 3) { c--; enterDir = 1; }
                
            }, 300);
        }

        function failSequence(path) {
            playSound('error');
            if(path.length > 0) path[path.length-1].classList.add('error-blink');
            setTimeout(() => {
                document.querySelectorAll('.slot').forEach(el => el.classList.remove('filled', 'error-blink'));
            }, 1500);
        }

        function winSequence() {
            playSound('win');
            const msg = document.getElementById('success-msg');
            msg.classList.remove('hidden');
            void msg.offsetWidth; // Reflow
            msg.classList.remove('opacity-0');
            msg.classList.add('flex');
            
            // Shower of blue particles
            const rect = document.getElementById('board').getBoundingClientRect();
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    createParticles(rect.left + Math.random()*rect.width, rect.top + Math.random()*rect.height);
                }, i * 50);
            }
        }

        function resetGame() {
            const msg = document.getElementById('success-msg');
            msg.classList.add('opacity-0');
            setTimeout(() => { msg.classList.add('hidden'); msg.classList.remove('flex'); clearBoard(); }, 500);
        }

        initGrid();
    </script>
</body>
</html>
