# Wize Development Kit — project config
# Generated for BRACHATEC Platform

[project]
name = "brachatec-platform"
kit_version = "0.15.0"

[install]
profiles = ["core", "web-overlay", "security-overlay"]
ide_targets = ["antigravity", "generic"]

[language]
# Language used when agents talk to the team in chat.
communication = "pt-BR"
# Language used when agents write artifacts to disk
# (brief.md, prd.md, architecture.md, gate.md, etc.).
document_output = "pt-BR"

[paths]
output_root    = ".wize"
planning       = ".wize/planning"
solutioning    = ".wize/solutioning"
implementation = ".wize/implementation"
knowledge      = ".wize/knowledge"
