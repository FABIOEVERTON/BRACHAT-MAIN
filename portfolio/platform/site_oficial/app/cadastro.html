<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BRACHATEC Platform</title>
    <style>
        :root { --bg: #09090b; --fg: #fafafa; --border: rgba(255,255,255,0.1); --cyan: #3ecfbe; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 32px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo svg { fill: var(--cyan); width: 24px; height: 24px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 6px; outline: none; }
        input:focus { border-color: var(--cyan); }
        .btn { width: 100%; padding: 12px; background: var(--cyan); color: #000; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn:hover { opacity: 0.9; }
        .links { margin-top: 16px; font-size: 12px; color: #888; }
        .links a { color: var(--cyan); text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4l7.5 15h-15L12 6z"/></svg>
            BRACHATEC
        </div>
        <h2 style="font-size: 18px; margin-top: 0;">Configuração de Conta</h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 24px;">Bem-vindo! Finalize seu cadastro pós-pagamento.</p>
        <input type="text" placeholder="CNPJ da Empresa">
        <input type="email" placeholder="E-mail corporativo">
        <input type="password" placeholder="Senha">
        <a href="/app/dashboard.html" class="btn">Criar Conta e Acessar</a>
        <div class="links">
            Já tem conta? <a href="/app/login.html">Fazer Login</a>
        </div>
        <div style="margin-top:24px;"><a href="/" style="color:#888; font-size: 11px; text-decoration:none;">&larr; Voltar ao site oficial</a></div>
    </div>
</body>
</html>
