<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - BrachaTec Platform</title>
    <style>
        :root { --bg: #09090b; --fg: #fafafa; --border: rgba(255,255,255,0.1); --cyan: #3ecfbe; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 32px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo svg { fill: var(--cyan); width: 24px; height: 24px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 6px; outline: none; }
        input:focus { border-color: var(--cyan); }
        .btn { width: 100%; padding: 12px; background: var(--cyan); color: #000; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn:hover { opacity: 0.9; }
        .links { margin-top: 16px; font-size: 12px; color: #888; }
        .links a { color: var(--cyan); text-decoration: none; }
    </style>

            <style>
            :root { --navy: #0a0e17 !important; --gold: #3ecfbe !important; --cyan: #3ecfbe !important; }
            body { background-color: var(--navy) !important; }
            .login-box, .auth-box, .card { background: rgba(20, 28, 43, 0.6) !important; backdrop-filter: blur(10px) !important; border: 1px solid rgba(255,255,255,0.05) !important; box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important; border-radius: 12px !important; }
            .bt-color { color: var(--gold) !important; font-weight: 700 !important; }
            /* PREMIUM OVERRIDE */
            </style>
            </head>
<body>
<canvas id="hero-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; background: radial-gradient(circle at 50% 0%, rgba(10,30,40,1) 0%, #0a0e17 80%); pointer-events: none; opacity: 0.8;"></canvas>

    <div class="box">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4l7.5 15h-15L12 6z"/></svg>
            <span style="color:var(--white);"><span style="color:var(--gold);">B</span>racha<span style="color:var(--gold);">T</span>ec</span>
        </div>
        <h2 style="font-size: 18px; margin-top: 0;">Configuração de Conta</h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 24px;">Bem-vindo! Finalize seu cadastro pós-pagamento.</p>
        <input type="text" placeholder="CNPJ da Empresa">
        <input type="email" placeholder="E-mail corporativo">
        <input type="password" placeholder="Senha">
        <a href="/app/dashboard.html" class="btn">Criar Conta e Acessar</a>
        <div class="links">
            Já tem conta? <a href="/app/login.html">Fazer Login</a>
        </div>
        <div style="margin-top:24px;"><a href="/" style="color:#888; font-size: 11px; text-decoration:none;">&larr; Voltar ao site oficial</a></div>
    </div>

            <script>
            const canvas = document.getElementById('hero-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let width, height, particles;
                function init() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; particles = []; for(let i=0; i<50; i++) particles.push({x:Math.random()*width, y:Math.random()*height, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, size:Math.random()*2+1}); }
                function animate() { requestAnimationFrame(animate); ctx.clearRect(0,0,width,height); ctx.fillStyle='#3ecfbe'; ctx.strokeStyle='rgba(62,207,190,0.1)'; particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>width)p.vx*=-1; if(p.y<0||p.y>height)p.vy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();}); for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dist=Math.hypot(particles[i].x-particles[j].x, particles[i].y-particles[j].y); if(dist<180){ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.lineWidth=1-(dist/180); ctx.stroke();}}} }
                window.addEventListener('resize', init); init(); animate();
            }
            </script>
            </body>
            
</html>
