<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT Muni — Configurações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #060913; color: #f8f9fa; margin: 0; }
    .glass-card { background: rgba(14, 21, 33, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(234,179,8,0.1); box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
    .input-field { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 14px; border-radius: 6px; outline: none; font-size: 14px; }
    .input-field:focus { border-color: #eab308; }
    .btn-save { background: #eab308; color: #000; font-weight: 600; padding: 10px 24px; border-radius: 6px; transition: all 0.2s; }
    .btn-save:hover { opacity: 0.8; }
  </style>
</head>
<body class="flex h-screen">
  <main class="flex-1 overflow-y-auto p-8">
    <a href="dashboard.html" class="text-gray-400 hover:text-white flex items-center gap-2 mb-6"><i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao Painel</a>
    <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
      <i data-lucide="settings" class="w-6 h-6 text-yellow-500"></i> Configurações (BT Muni)
    </h2>
    <div class="max-w-3xl space-y-6">
      <div class="glass-card p-6 rounded-xl">
        <h3 class="text-sm font-mono text-gray-400 uppercase tracking-widest mb-4">Dados da Conta</h3>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs mb-1 text-gray-400">Nome</label><input type="text" class="input-field" value="Prefeito"></div>
          <div><label class="block text-xs mb-1 text-gray-400">E-mail</label><input type="email" class="input-field" value="gab@sp.gov.br"></div>
          <div class="col-span-2"><label class="block text-xs mb-1 text-gray-400">Prefeitura</label><input type="text" class="input-field" value="São Paulo"></div>
        </div>
        <div class="mt-4 flex justify-end"><button class="btn-save">Salvar Alterações</button></div>
      </div>
      <div class="glass-card p-6 rounded-xl">
        <h3 class="text-sm font-mono text-gray-400 uppercase tracking-widest mb-4">Integrações Específicas</h3>
        <input type="text" class="input-field" value="IBGE: 3550308">
        <div class="mt-4 flex justify-end"><button class="btn-save">Atualizar Integrações</button></div>
      </div>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
