[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezra-shared"
version = "0.1.0"
description = "Núcleo compartilhado Python da Plataforma EZRA (PRD §2.2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.35",
    "reportlab>=4.2",
]

[tool.setuptools.packages.find]
include = ["services*"]