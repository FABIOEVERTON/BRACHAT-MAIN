# EZRA CI — quality gates (PRD §10.1, E0-S10, F0-40/F0-41/F0-42/F0-44)
# Stages em ordem: install → lint → type-check → test(cobertura) → build →
# WORM delete gate → gitleaks. Falha em QLQR etapa aborta o deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"

jobs:
  quality:
    name: Lint + Type-check + Test + Coverage (gate 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python deps (prod+dev)
        run: pip install -e ".[dev]"

      - name: Install JS deps (turbo workspaces)
        run: npm ci

      - name: Lint Python (ruff)
        run: ruff check services/

      - name: Type-check Python (mypy opcional FASE 1) — placeholder
        run: python -c "import fastapi, sqlalchemy, reportlab, boto3"  # imports ok

      - name: Type-check + lint JS (turbo)
        run: npm run type-check 2>/dev/null || npm run build

      - name: Test Python com cobertura (gate >= 80% — F0-41)
        run: pytest services/shared/tests/ --cov=services.shared --cov-report=term
    # --cov com fail_under do pyproject enforça o gate

  worm-gate:
    name: WORM delete-blocked (F0-42)
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install boto3
      - name: Rodar gate de deleção WORM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os, boto3, time
          from botocore.exceptions import ClientError
          os.environ["AWS_ENDPOINT_URL"] = "http://localhost:4566"
          s3 = boto3.client("s3", endpoint_url="http://localhost:4566",
                            aws_access_key_id="test", aws_secret_access_key="test",
                            region_name="us-east-1")
          s3.create_bucket(Bucket="ezra-worm")
          s3.put_object(Bucket="ezra-worm", Key="k.pdf", Body=b"x",
                        ObjectLockMode="COMPLIANCE",
                        ObjectLockRetainUntilDate=time.strftime("%Y-%m-%dT%H:%M:%SZ",
                                                                time.gmtime(time.time()+31536000)))
          v = s3.head_object(Bucket="ezra-worm", Key="k.pdf")["VersionId"]
          try:
              s3.delete_object(Bucket="ezra-worm", Key="k.pdf", VersionId=v)
          except ClientError as e:
              assert "AccessDenied" in str(e), f"esperava AccessDenied, veio {e}"
              print("WORM GATE PASS — deleção bloqueada")
              exit(0)
          raise SystemExit("FALHA: deleção WORM permitida (gate de segurança)")
          EOF
      - name: Parity check script local (mais assert)
        run: |
          if [ -x scripts/localstack_worm_check.py ]; then
            python scripts/localstack_worm_check.py
          fi

  secrets-scan:
    name: Gitleaks — sem segredos (F0-44)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build workspaces + imagens (F0-40)
    runs-on: ubuntu-latest
    needs: [quality, worm-gate, secrets-scan]
    strategy:
      matrix:
        image: [web, shared]
    steps:
      - uses: actions/checkout@v4
      - name: Build Next (web)
        if: matrix.image == 'web'
        run: |
          cd apps/web && npm run build
      - name: Docker build web
        if: matrix.image == 'web'
        run: docker build -f apps/web/Dockerfile -t ezra-web:${{ github.sha }} .
      - name: Docker build shared
        if: matrix.image == 'shared'
        run: docker build -f services/shared/Dockerfile -t ezra-shared:${{ github.sha }} .
      - name: Image tag ok
        run: echo "build ${{ matrix.image }} ${{ github.sha }} ok"