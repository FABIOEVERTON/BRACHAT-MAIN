[project]
name = "ezra-platform"
version = "0.1.0"
description = "Plataforma EZRA — governança de IA e municipal com laudo pericial (WORM + SHA-256 chain)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "reportlab>=4.2",
    "redis>=5.0",
]
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services"]

[tool.coverage.run]
source = ["services/shared"]
branch = true
omit = ["services/shared/config.py"]

[tool.coverage.report]
fail_under = 80.0  # quality gate F0-41 (PRD §10.1)
show_missing = true