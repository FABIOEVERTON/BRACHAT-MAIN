<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BRACHAT · Organizational Chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','system-ui',-apple-system,sans-serif;background:#f0f2f5;padding:20px;min-height:100vh;color:#1f2937}
.container{max-width:1400px;margin:0 auto}

.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.title h1{font-size:22px;font-weight:700;color:#111827;margin:0}
.title h1 span{color:#7c3aed}
.title p{font-size:12px;color:#6b7280;margin-top:2px;letter-spacing:.5px}
.sys{display:flex;gap:14px;font-size:11px;background:#fff;padding:6px 14px;border-radius:10px;border:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sys div{display:flex;gap:4px;align-items:center}
.sys .l{color:#9ca3af}.sys .v{color:#111827;font-weight:600;font-variant-numeric:tabular-nums}

.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.lvl{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;position:relative;padding:8px 0}
.lvl+.lvl::before{content:'';display:block;position:absolute;top:-8px;left:50%;width:2px;height:8px;background:#d1d5db}
.lbl{width:100%;text-align:center;font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;font-weight:600}

.card{background:#fff;border-radius:10px;padding:10px 14px;border:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(0,0,0,.04);text-align:center;min-width:110px;cursor:default;position:relative;transition:all .15s}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card.inactive{opacity:.25;filter:grayscale(.9);pointer-events:none}
.card .nm{font-size:13px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;justify-content:center;gap:5px}
.card .role{font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card .status{font-size:10px;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:2px}
.card .phase{font-size:9px;background:#f3f4f6;padding:1px 6px;border-radius:4px;color:#6b7280;display:inline-block}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.on{background:#10b981;box-shadow:0 0 4px rgba(16,185,129,.4)}
.dot.off{background:#d1d5db}
.dot.busy{background:#f59e0b;box-shadow:0 0 4px rgba(245,158,11,.4);animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.lvl-orch .card{border-color:#fbbf24;background:linear-gradient(135deg,#fffbeb,#fff)}
.lvl-orch .card .nm{color:#d97706}
.lvl-dir .card{border-color:#0e7490;background:linear-gradient(135deg,#ecfeff,#fff)}
.lvl-dir .card .nm{color:#0e7490}
.lvl-build .card{border-color:#059669;background:linear-gradient(135deg,#ecfdf5,#fff)}
.lvl-build .card .nm{color:#059669}
.lvl-study .card{border-color:#d1d5db;background:#fafafa}
.lvl-study .card .nm{color:#4b5563}

.tt{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1f2937;color:#f9fafb;padding:6px 10px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:10;pointer-events:none}
.tt::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1f2937}
.card:hover .tt{display:block}

.legend{display:flex;gap:20px;justify-content:center;margin:20px 0 0;flex-wrap:wrap;font-size:11px;color:#6b7280}
.legend div{display:flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.ft{text-align:center;font-size:10px;color:#9ca3af;margin-top:20px;padding-top:12px;border-top:1px solid #e5e7eb}

.tree{position:relative}
.conn{display:flex;justify-content:center;gap:4px;height:16px;position:relative}
.conn-line{width:2px;height:12px;background:#d1d5db}

@media(max-width:640px){
  body{padding:12px}
  .header{flex-direction:column}
  .sys{gap:10px;flex-wrap:wrap}
  .lvl{gap:10px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">
      <h1>BRACHAT <span>·</span> Organizational Chart</h1>
      <p>Governance and Execution</p>
    </div>
    <div class="sys" id="sys">
      <div><span class="l">CPU</span><span class="v" id="cpu">—</span></div>
      <div><span class="l">RAM</span><span class="v" id="ram">—</span></div>
      <div><span class="l">LOAD</span><span class="v" id="load">—</span></div>
    </div>
  </div>

  <div class="tree">
    <div class="lvl lvl-orch" id="lvl-orch"><div class="lbl">orchestrator</div></div>
    <div class="conn" id="conn1"><div class="conn-line"></div></div>
    <div class="lvl lvl-dir" id="lvl-dir"><div class="lbl">directors</div></div>
    <div class="lvl lvl-build" id="lvl-build"><div class="lbl">builders</div></div>
    <div class="conn" id="conn3"><div class="conn-line"></div></div>
    <div class="lvl lvl-study" id="lvl-study"><div class="lbl">studies</div></div>
  </div>

  <div class="legend">
    <div><span class="sw" style="background:#fbbf24"></span>Orchestrator</div>
    <div><span class="sw" style="background:#0e7490"></span>Directors</div>
    <div><span class="sw" style="background:#059669"></span>Builders</div>
    <div><span class="sw" style="background:#d1d5db"></span>Studies</div>
  </div>

  <div class="ft" id="ft">⏻ connecting to live data…</div>
</div>

<script>
const WS='ws://'+location.hostname+':8765';let ws=null,rt=0;
function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v||'—'}

function realSt(st){
  if(!st||typeof st!=='object')return 'off';
  if(st.daily_log&&typeof st.daily_log==='object'&&Object.keys(st.daily_log).length>0)return 'on';
  if(st.current_phase&&st.current_phase!=='')return 'on';
  if(st.current_day&&st.current_day>0)return 'on';
  if(st.last_topic&&st.last_topic!=='')return 'on';
  if(st.current_topic&&st.current_topic!=='')return 'on';
  if(st.last_action&&st.last_action!==null)return 'on';
  if(st.last_task&&st.last_task!==null)return 'on';
  return 'off';
}

function card(nm,role,dotSt,phase,tip){
  var cls=dotSt==='off'?' card inactive':'';
  return '<div class="card'+cls+'"><div class="nm"><span class="dot '+dotSt+'"></span>'+nm+'</div>'+
    '<div class="role">'+role+'</div>'+
    '<div class="status">'+(dotSt==='on'?'active':dotSt==='busy'?'processing':'inactive')+
    (phase&&phase!=='—'?' · <span class="phase">'+phase+'</span>':'')+'</div>'+
    '<div class="tt">'+tip+'</div></div>';
}

function renderCategory(elemId, agents, mapFn){
  var el=document.getElementById(elemId);
  if(!el)return;
  if(!agents||agents.length===0){
    return;
  }
  var h='<div class="lbl">'+el.getAttribute('data-label')||''+'</div>';
  for(var i=0;i<agents.length;i++){
    var ag=agents[i], st=ag.state||{}, active=realSt(st);
    var nm=ag.label||ag.name.charAt(0).toUpperCase()+ag.name.slice(1);
    var ph=[st.current_phase,st.current_module?'M'+st.current_module:'',st.current_day?'D'+st.current_day:''].filter(Boolean).join(' ')||'—';
    var role=ag.name||'';
    var tip=role;
    if(mapFn) mapFn(ag, nm, st);
    h+=card(nm,role,active,ph,tip);
  }
  el.innerHTML=h;
}

var DIR_LABEL={
  'aisio':{nm:'AÍSIO',role:'governance & compliance'},
  'gilmario':{nm:'GILMÁRIO',role:'education & branding'},
  'jessica':{nm:'JÉSSICA',role:'legal'},
  'josue':{nm:'JOSUÉ',role:'executive & finance'},
  'nice':{nm:'NICE',role:'home governance'},
};

function render(d){
  if(!d)return;
  if(d.system){
    set('cpu',d.system.cpu||'—');set('ram',d.system.memory||'—');set('load',d.system.load||'—');
  }
  set('ft',d.timestamp?'🕘 '+d.timestamp+' · live':'⏻ connecting…');

  var ez=d.bridges?.ezra||{},ni=d.bridges?.nice||{};
  var ezSt=ez.status==='processing'?'busy':(ez.status==='online'||ez.status==='idle'?'on':'off');
  var niSt=ni.status==='processing'?'busy':(ni.status==='online'||ni.status==='idle'?'on':'off');

  document.getElementById('lvl-orch').innerHTML=
    '<div class="lbl">orchestrator</div>'+
    card('EZRA','orchestrator',ezSt,ez.phase||'—','Agent: '+(ez.active_agent||'—')+' | Msgs: '+(ez.last_msg?ez.last_msg.slice(0,30):'—'))+
    card('NICE','home governance bridge',niSt,ni.threshold||'—','Threshold: '+(ni.threshold||'—'));

  var ags=d.agents||{};

  var dirs=ags.director||[];
  var dh='<div class="lbl">directors</div>';
  for(var i=0;i<dirs.length;i++){
    var ag=dirs[i], st=ag.state||{}, active=realSt(st);
    var info=DIR_LABEL[ag.name]||{nm:ag.label,role:ag.name};
    var ph=[st.current_phase,st.current_day?'D'+st.current_day:''].filter(Boolean).join(' ')||'—';
    dh+=card(info.nm,info.role,active,ph,info.role);
  }
  document.getElementById('lvl-dir').innerHTML=dh;

  var builders=ags.builder||[];
  var bh='<div class="lbl">builders</div>';
  for(var i=0;i<builders.length;i++){
    var ag=builders[i], st=ag.state||{}, active=realSt(st);
    var nm=ag.label;
    var ph=[st.current_phase,st.current_day?'D'+st.current_day:''].filter(Boolean).join(' ')||'—';
    var role=ag.name;
    if(ez.active_agent===ag.name) active='busy';
    bh+=card(nm,role,active,ph,role);
  }
  document.getElementById('lvl-build').innerHTML=bh;

  var studies=ags.studies||[];
  var sh='<div class="lbl">studies</div>';
  for(var i=0;i<studies.length;i++){
    var ag=studies[i], st=ag.state||{}, active=realSt(st);
    var nm=ag.label;
    var ph=[st.current_phase,st.current_module?'M'+st.current_module:'',st.current_day?'D'+st.current_day:''].filter(Boolean).join(' ')||'—';
    var role=ag.name;
    sh+=card(nm,role,active,ph,role);
  }
  document.getElementById('lvl-study').innerHTML=sh;
}

function connect(){
  if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;
  ws=new WebSocket(WS);
  ws.onopen=()=>{rt=0};
  ws.onmessage=e=>{try{render(JSON.parse(e.data))}catch(ex){}};
  ws.onerror=ws.onclose=()=>{setTimeout(connect,Math.min(3000+rt++*1000,15000))};
}
connect();
</script>
</body>
</html>
