# Ezra OS — compose de produção
# Uso: docker compose -f docker/docker-compose.yml up -d
# Segredos: copie .opencode/mcp/credentials/secrets.env para docker/secrets.env (NUNCA no git)
# Proteja o servidor headless: defina OPENCODE_SERVER_PASSWORD em secrets.env

services:
  ezra:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ezra
    container_name: ezra
    restart: unless-stopped
    ports:
      - "3789:3789"
    volumes:
      - ../.opencode/state.json:/workspace/.opencode/state.json
      - ../.opencode/governance-ledger.jsonl:/workspace/.opencode/governance-ledger.jsonl
      - ../.opencode/mcp:/workspace/.opencode/mcp:ro
      - ../.mem0:/workspace/.mem0
    env_file:
      - secrets.env

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_USER_MANAGEMENT_DISABLED=true
    volumes:
      - n8n_data:/home/node/.n8n

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  n8n_data:
  openwebui_data:
