name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.2"

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyright bandit pip-audit detect-secrets pre-commit
          pip install -e .[dev]

      - name: Run Ruff (lint + format check)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run MyPy (strict type check)
        run: mypy --strict .

      - name: Run Pyright
        run: pyright

      - name: Run Bandit (security)
        run: bandit -r . -x ./venv,./.venv,./node_modules,./chroma,./logs,./tests,./__pycache__ -ll -f json -o bandit-report.json || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit detect-secrets

      - name: Run pip-audit
        run: |
          pip install -e .[dev]
          pip-audit --desc --format=json --output=pip-audit-report.json || true

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline || true

      - name: Upload Secrets Baseline
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-baseline
          path: .secrets.baseline

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run pytest with coverage
        run: |
          pytest -v --tb=short --cov=portfolio --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  build-and-test-docker:
    name: Build & Test Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: brachat-main:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-app -p 8501:8501 brachat-main:test
          sleep 15
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker stop test-app

  deploy-staging:
    name: Deploy to Staging (Streamlit Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build-and-test-docker]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to Streamlit Cloud
        run: |
          echo "Deploy to Streamlit Cloud triggered for develop branch"
          # Streamlit Cloud auto-deploys on push to connected repo
          # This step is a placeholder for any additional staging steps

  deploy-production:
    name: Deploy to Production (Streamlit Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build-and-test-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Streamlit Cloud
        run: |
          echo "Deploy to Streamlit Cloud triggered for main branch"
          # Streamlit Cloud auto-deploys on push to connected repo
          # This step is a placeholder for any additional production steps

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-type-check, security-scan, test, build-and-test-docker]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.lint-and-type-check.result }},${{ needs.security-scan.result }},${{ needs.test.result }},${{ needs.build-and-test-docker.result }}"
          echo "Pipeline completed with status: $STATUS"
          if [[ "$STATUS" == *"failure"* ]]; then
            echo "::warning::Pipeline failed - check GitHub Actions for details"
            exit 1
          fi