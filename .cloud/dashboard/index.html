<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS · AI Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030712;
  --panel: rgba(17, 24, 39, 0.6);
  --border: rgba(55, 65, 81, 0.5);
  --text: #f9fafb;
  --text-muted: #9ca3af;
  --glow-ezra: rgba(245, 158, 11, 0.6);
  --glow-aisio: rgba(14, 165, 233, 0.6);
  --glow-active: rgba(16, 185, 129, 0.6);
  --line: #374151;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.05), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 25%);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem;
  overflow-x: hidden;
}

/* Glassmorphism utility */
.glass {
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 12px;
}

/* Header HUD */
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3rem;
  padding: 1rem 2rem;
}
.hud-title h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(to right, #38bdf8, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hud-title p {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: 0.25rem;
}

.sys-metrics {
  display: flex;
  gap: 1.5rem;
}
.metric {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.metric .val {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 1.1rem;
  color: #10b981;
}
.metric .lbl {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Organogram Tree */
.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  width: 100%;
}

/* Level Rows */
.row {
  display: flex;
  justify-content: center;
  gap: 2rem;
  position: relative;
  padding: 1rem 0;
  width: 100%;
}

/* Connection Lines */
.conn-vertical {
  width: 2px;
  height: 30px;
  background: var(--line);
  position: relative;
}

.conn-horizontal {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  height: 2px;
  background: var(--line);
  width: 400px; /* Adjust based on children */
}
.conn-drop {
  position: absolute;
  top: 0;
  width: 2px;
  height: 1rem;
  background: var(--line);
}

/* Agent Card */
.agent {
  position: relative;
  width: 220px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: all 0.3s ease;
  z-index: 10;
}

/* States */
.agent.idle {
  opacity: 0.4;
  filter: grayscale(1);
}
.agent.idle:hover {
  opacity: 0.8;
  filter: grayscale(0);
}

.agent.active {
  opacity: 1;
  box-shadow: 0 0 20px var(--glow-active);
  border-color: #10b981;
  transform: translateY(-2px);
}
.agent.active .status-dot {
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.8; }
}

/* Specific Agent Glowing Colors */
#card-ezra.active {
  box-shadow: 0 0 25px var(--glow-ezra);
  border-color: #f59e0b;
}
#card-ezra.active .status-dot { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }

#card-aisio.active {
  box-shadow: 0 0 25px var(--glow-aisio);
  border-color: #0ea5e9;
}
#card-aisio.active .status-dot { background: #0ea5e9; box-shadow: 0 0 10px #0ea5e9; }


/* Inner Elements */
.agent-name {
  font-size: 1rem;
  font-weight: 700;
  margin-top: 0.5rem;
  letter-spacing: 1px;
}
.agent-role {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 0.25rem;
  letter-spacing: 1px;
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.75rem;
  font-size: 0.75rem;
  color: var(--text-muted);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4b5563;
}
.terminal-line {
  margin-top: 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  color: #34d399;
  background: rgba(0,0,0,0.4);
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid #10b981;
}

/* Base Level layout */
.base-grid {
  display: flex;
  gap: 4rem;
  margin-top: 1rem;
  position: relative;
}
.base-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}
.group-title {
  font-size: 0.7rem;
  color: var(--line);
  text-transform: uppercase;
  letter-spacing: 4px;
}
.agents-row {
  display: flex;
  gap: 1.5rem;
}

/* Footer Status */
.footer {
  text-align: center;
  margin-top: 4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-muted);
}
.footer span { color: #10b981; }

</style>
</head>
<body>

<div class="hud glass">
  <div class="hud-title">
    <h1>NEXUS COMMAND</h1>
    <p>Real-Time Multi-Agent Organogram</p>
  </div>
  <div class="sys-metrics">
    <div class="metric"><span class="val" id="sys-cpu">--%</span><span class="lbl">CPU LOAD</span></div>
    <div class="metric"><span class="val" id="sys-ram">--/--</span><span class="lbl">MEMORY</span></div>
    <div class="metric"><span class="val" id="sys-load">--</span><span class="lbl">SYSTEM LOAD</span></div>
  </div>
</div>

<div class="tree">

  <!-- LEVEL 1: EZRA -->
  <div class="row">
    <div class="agent glass idle" id="card-ezra">
      <div class="agent-name">EZRA</div>
      <div class="agent-role">Orchestrator</div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">Idle</span>
      </div>
      <div class="terminal-line" id="term-ezra">> Awaiting dispatch...</div>
    </div>
  </div>

  <div class="conn-vertical"></div>

  <!-- LEVEL 2: AISIO -->
  <div class="row">
    <div class="agent glass idle" id="card-aisio">
      <div class="agent-name">AÍSIO</div>
      <div class="agent-role">Governance Gatekeeper</div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">Idle</span>
      </div>
      <div class="terminal-line" id="term-aisio">> Monitoring requests...</div>
    </div>
  </div>

  <div class="conn-vertical" style="height: 40px;"></div>

  <!-- LEVEL 3: DIRECTORS & BUILDERS -->
  <div class="row" style="padding-top: 0;">
    <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 2px; background: var(--line);"></div>
    
    <div class="base-grid" style="width: 60%; justify-content: space-between;">
      
      <!-- DIRECTORS -->
      <div class="base-group">
        <div class="conn-drop" style="left: 0;"></div>
        <div class="group-title">Directors</div>
        <div class="agents-row" id="row-directors">
          <!-- Injected via JS -->
        </div>
      </div>

      <!-- BUILDERS / ENGINEERS -->
      <div class="base-group">
        <div class="conn-drop" style="right: 0;"></div>
        <div class="group-title">Production Line</div>
        <div class="agents-row" id="row-builders">
          <!-- Injected via JS -->
        </div>
      </div>

    </div>
  </div>

</div>

<div class="footer">
  <p id="conn-status">⏻ Connecting to live websocket data...</p>
</div>

<script>
const host = location.hostname || '127.0.0.1';
const WS_URL = 'ws://' + host + ':8765';
let ws = null;
let retryDelay = 1000;

const KNOWN_ROLES = {
  'nice': 'Domestic Governance',
  'jessica': 'Legal & Contracts',
  'gilmario': 'Education',
  'artur': 'Lead Planner',
  'engineer': 'Software Engineer (Baruch)',
  'baruch': 'Software Engineer (Baruch)'
};
const KNOWN_NAMES = {
  'engineer': 'BARUCH',
};

function updateHUD(sys) {
  if(!sys) return;
  document.getElementById('sys-cpu').textContent = sys.cpu || '--%';
  document.getElementById('sys-ram').textContent = sys.memory || '--/--';
  document.getElementById('sys-load').textContent = sys.load || '--';
}

function renderAgent(id, name, role, isActive, terminalText) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  
  if (isActive) {
    card.classList.remove('idle');
    card.classList.add('active');
    card.querySelector('.status-text').textContent = 'Processing';
  } else {
    card.classList.remove('active');
    card.classList.add('idle');
    card.querySelector('.status-text').textContent = 'Idle';
  }

  if (terminalText) {
    card.querySelector('.terminal-line').textContent = '> ' + terminalText;
  }
}

function generateAgentCardHTML(id, rawName, isActive) {
  const name = KNOWN_NAMES[rawName] || rawName.toUpperCase();
  const role = KNOWN_ROLES[rawName] || 'Agent';
  const stateCls = isActive ? 'active' : 'idle';
  const statusTxt = isActive ? 'Processing' : 'Idle';
  
  return `
    <div class="agent glass ${stateCls}" id="card-${id}">
      <div class="agent-name">${name}</div>
      <div class="agent-role">${role}</div>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">${statusTxt}</span>
      </div>
    </div>
  `;
}

function processMessage(data) {
  const t = new Date().toLocaleTimeString();
  document.getElementById('conn-status').innerHTML = `<span>⏻</span> LIVE CONNECTION SECURED AT ${t}`;

  updateHUD(data.system);

  const activeAgent = (data.bridges && data.bridges.ezra) ? data.bridges.ezra.active_agent : '';
  const ezraMsg = (data.bridges && data.bridges.ezra && data.bridges.ezra.last_msg) ? data.bridges.ezra.last_msg : 'Awaiting dispatch...';
  
  // Ezra Logic
  const ezraActive = (activeAgent && activeAgent !== '') || (data.bridges && data.bridges.ezra && data.bridges.ezra.status === 'processing');
  renderAgent('ezra', 'EZRA', 'Orchestrator', ezraActive, ezraMsg);

  // Aísio Logic
  const aisioActive = (activeAgent === 'aisio');
  renderAgent('aisio', 'AÍSIO', 'Gatekeeper', aisioActive, aisioActive ? 'Validating request...' : 'Monitoring...');

  // Other Agents Generation
  let dirsHTML = '';
  let buildsHTML = '';

  const ags = data.agents || {};
  
  // Directors
  const dirs = ags.director || [];
  dirs.forEach(ag => {
    if(ag.name === 'aisio') return; // Rendered alone
    dirsHTML += generateAgentCardHTML('dyn-'+ag.name, ag.name, activeAgent === ag.name);
  });
  
  // Builders & Engineers
  const builders = ags.builder || [];
  const engineers = ags.engineer || [];
  const production = [...builders, ...engineers];
  
  production.forEach(ag => {
    buildsHTML += generateAgentCardHTML('dyn-'+ag.name, ag.name, activeAgent === ag.name);
  });

  document.getElementById('row-directors').innerHTML = dirsHTML || '<span style="color:#6b7280; font-size:10px;">No directors loaded</span>';
  document.getElementById('row-builders').innerHTML = buildsHTML || '<span style="color:#6b7280; font-size:10px;">No production loaded</span>';
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  ws = new WebSocket(WS_URL);
  
  ws.onopen = () => {
    retryDelay = 1000;
    document.getElementById('conn-status').innerHTML = '<span>⏻</span> CONNECTED';
  };
  
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      processMessage(data);
    } catch(ex) {}
  };
  
  ws.onclose = () => {
    document.getElementById('conn-status').innerHTML = '⏻ Connection lost. Retrying...';
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 1.5, 15000);
  };
  
  ws.onerror = ws.onclose;
}

connect();
</script>
</body>
</html>
